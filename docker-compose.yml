name: test-catalog

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 20

  minio:
    <<: *restart
    # Официальные образы minio/minio больше не публикуются в Docker Hub; это сборка MinIO от Chainguard.
    image: chainguard/minio@sha256:32c504bea4574d8f29d719b37bc0dad920ecf3e22b81dc5cea0bb105af2ce10f
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes: [miniodata:/data]

  backend:
    <<: *restart
    build: ./backend
    deploy: { replicas: 2 }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN}
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      PUBLIC_MEDIA_BASE: /media
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_started }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      retries: 10

  frontend:
    <<: *restart
    build: ./frontend
    deploy: { replicas: 2 }
    environment:
      INTERNAL_API_URL: http://backend:8000

  bot:
    <<: *restart
    build: ./bot
    deploy:
      replicas: ${BOT_REPLICAS:-2}
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      ADMIN_IDS: ${ADMIN_IDS}
      WEBAPP_URL: ${PUBLIC_URL}/
      BACKEND_URL: http://backend:8000
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN}
      BOT_MODE: ${BOT_MODE:-webhook}
      WEBHOOK_BASE: ${PUBLIC_URL}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
    depends_on:
      backend: { condition: service_healthy }

  nginx:
    <<: *restart
    image: nginx:1.27.5-alpine
    ports: ["${HTTP_PORT:-8080}:80"]
    volumes: ["./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [frontend, backend]

volumes:
  pgdata:
  miniodata:
