# Docker DNS отдаёт IP всех реплик сервиса. `resolve` (nginx >= 1.27.3) периодически
# перечитывает их, так что `docker compose up --scale backend=N` подхватывается без
# перезапуска nginx; запросы распределяются round-robin, упавшая реплика пропускается.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream frontend { zone frontend 64k; server frontend:3000 resolve; }
upstream backend  { zone backend 64k;  server backend:8000 resolve; }
upstream bot      { zone bot 64k;      server bot:8080 resolve; }
upstream minio    { zone minio 64k;    server minio:9000 resolve; }

server {
    listen 80;
    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout http_502 http_503;
    }

    # Публичное чтение картинок из бакета MinIO.
    location /media/ {
        proxy_pass http://minio/;
        proxy_set_header Host minio:9000;
        proxy_hide_header Set-Cookie;
        expires 7d;
        limit_except GET HEAD { deny all; }
    }

    location /tg/ {
        proxy_pass http://bot;
        proxy_set_header Host $host;
        proxy_next_upstream error timeout http_502 http_503;
    }

    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout http_502 http_503;
    }
}
